plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def hasKey = file("${rootDir}/keystore/boma.jks").exists()
android {
    namespace 'com.bomaload.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.bomaload.app"
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName "17.0"
    }
    signingConfigs {
        boma {
            storeFile file("${rootDir}/keystore/boma.jks")
            storePassword "boma1234"
            keyAlias "boma"
            keyPassword "boma1234"
        }
    }
    buildTypes {
        debug {
            if (hasKey) signingConfig signingConfigs.boma
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
