name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Get Gradle 8.3
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.3-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d $HOME
      - name: Build debug APK
        run: $HOME/gradle-8.3/bin/gradle assembleDebug --no-daemon
      - name: Read version
        id: v
        run: echo "code=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)" >> $GITHUB_OUTPUT
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.code }}
          name: Boma Load v${{ steps.v.outputs.code }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: BomaLoad-APK
          path: app/build/outputs/apk/debug/app-debug.apk
